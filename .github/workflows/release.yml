name: Release and Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.3)"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: "https://npm.pkg.github.com"
          scope: "@rakutenrewards"

      - name: Normalize version
        id: ver
        run: echo "version=${RAW_VERSION#v}" >> "$GITHUB_OUTPUT"
        env:
          RAW_VERSION: ${{ inputs.version }}

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:lib

      - name: Bump version in package.json
        run: npm version ${{ steps.ver.outputs.version }} --no-git-tag-version

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash
          git pull --rebase origin main
          git stash pop
          git add package.json package-lock.json
          git commit -m "chore: release v${{ steps.ver.outputs.version }}"
          git tag -d "v${{ steps.ver.outputs.version }}" 2>/dev/null || true
          git push origin --delete "v${{ steps.ver.outputs.version }}" 2>/dev/null || true
          git tag "v${{ steps.ver.outputs.version }}"
          git push origin main "v${{ steps.ver.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ steps.ver.outputs.version }}"
          name: "v${{ steps.ver.outputs.version }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
